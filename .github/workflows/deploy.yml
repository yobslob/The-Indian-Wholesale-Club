name: Deploy

# Manual only (Actions → Deploy → Run workflow), reviewed in R7:
# - Production exists since 2026-10-06 (Supabase in us-east-1, Vercel). The domain waits on Q-9, and the app's
#   bundle ids are still placeholders (com.root.app): choose them before the first Play Store upload.
# - Android only: iOS needs an Apple Developer account (not yet). The app's public settings come from the EAS
#   "production" environment (eas.json; docs/ops.md §Going live, step 9), never from apps/app/.env.
# - Run it only on a commit whose CI run is green; `next build` no longer repeats lint and
#   typecheck (engineering.md P7), CI is the gate.
# - Mobile builds are uploaded to EAS but never auto-submitted to the stores.
# The secrets below belong to the PRODUCTION projects (ops.md §Environments), never dev.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to push migrations to production and deploy'
        required: true
      android_profile:
        description: 'Android build: preview = an APK to install on a phone, production = an AAB for Google Play'
        type: choice
        options: [preview, production]
        default: preview

jobs:
  guard:
    name: Confirm
    runs-on: ubuntu-latest
    steps:
      - name: Require the confirmation word
        if: ${{ inputs.confirm != 'deploy' }}
        run: |
          echo 'Not deploying: the confirmation input was not "deploy".'
          exit 1

  deploy-supabase:
    name: Deploy Supabase migrations
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Applies new migrations only. Seeds (demo data) are never pushed to production.
      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-web:
    name: Deploy web (Vercel deploy hook)
    runs-on: ubuntu-latest
    needs: deploy-supabase
    steps:
      - name: Trigger Vercel deployment
        run: curl --fail -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

  build-mobile:
    name: Build the Android app (EAS, no store submit)
    runs-on: ubuntu-latest
    needs: deploy-supabase
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # iOS: add `--platform ios` builds back once there is an Apple Developer account.
      - name: Build Android
        run: eas build --platform android --profile ${{ inputs.android_profile }} --non-interactive --no-wait
        working-directory: apps/app
