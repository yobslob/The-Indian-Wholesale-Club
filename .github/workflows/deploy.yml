name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-supabase:
    name: Deploy Supabase Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Edge functions intentionally omitted (D4): all API logic lives in
      # Next.js API routes; supabase/functions does not exist in this repo.

  deploy-web:
    name: Deploy Web (Vercel)
    runs-on: ubuntu-latest
    needs: deploy-supabase
    steps:
      - name: Trigger Vercel Deployment
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

  deploy-mobile:
    name: Build & Submit Mobile
    runs-on: ubuntu-latest
    needs: deploy-supabase
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Submit iOS
        run: eas build --platform ios --auto-submit --non-interactive
        working-directory: apps/app

      - name: Build and Submit Android
        run: eas build --platform android --auto-submit --non-interactive
        working-directory: apps/app
