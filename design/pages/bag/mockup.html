<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IWC design pass: 9 bag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Karla:wght@400;500;600&family=Syne:wght@400;500;600&family=Gelasio&display=swap">
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/page.css">
<link rel="stylesheet" href="../_shared/shell.css">
<link rel="stylesheet" href="../_shared/cards.css">
<style>
/* ---------- Bag (round 1): today's page (features/cart) in the D-079 / D-080 fonts, with photos, a − 1 + stepper, the
 * bag as a side panel, and an empty bag that is not blank. ---------- */
.bg { --g: clamp(16px, 2.2cqi, 32px); --gap: clamp(12px, 1.4cqi, 20px); padding: 0 var(--g) clamp(48px, 6cqi, 96px); }
.bg h1 { margin: 0; padding: clamp(24px, 2.6cqi, 40px) 0 20px; font: 500 clamp(32px, 3cqi, 52px)/1.1 var(--font-heading); letter-spacing: -.02em; color: #1D1A17; }
.lines { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ln { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; align-items: center; gap: 12px 20px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.ln .ph, .ln .pic { width: 72px; aspect-ratio: 3 / 4; border-radius: 12px; background: var(--land) center / cover no-repeat; display: block; }
.ln .nm { font: 600 15px/1.3 var(--font-ui); color: #000; text-decoration: none; }
.ln .op { display: block; margin-top: 2px; font: 400 14px/1.3 var(--font-ui); color: var(--ink-muted); }
.step { display: inline-flex; align-items: center; height: 44px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--paper); }
.step button { all: unset; cursor: pointer; width: 44px; height: 44px; display: grid; place-items: center; font: 500 18px/1 var(--font-ui); color: #000; }
.step button:disabled { color: var(--line); cursor: default; }
.step output { min-width: 22px; text-align: center; font: 600 15px/1 var(--font-ui); color: #000; }
.ln .pr { font: 500 15px/1 var(--font-ui); color: #000; min-width: 70px; text-align: right; }
.ln .rm { font: 500 14px/1 var(--font-ui); color: #000; text-underline-offset: 3px; }
.tot { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 0 0; }
.tot p { margin: 0; font: 500 16px/1.3 var(--font-ui); color: #000; }
.tot p b { font-weight: 700; }
.tot small { display: block; margin-top: 4px; font: 400 13px/1.4 var(--font-body); color: var(--ink-muted); }
.co { display: inline-grid; place-items: center; height: 52px; padding: 0 28px; border-radius: var(--radius-pill); background: var(--brand); color: var(--on-brand); font: 600 16px/1 var(--font-ui); text-decoration: none; }
@container (max-width: 640px) {
  .ln { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: 'pic nm pr' 'pic step rm'; }
  .ln .pic { grid-area: pic; width: 64px; } .ln .info { grid-area: nm; } .ln .step { grid-area: step; justify-self: start; } .ln .pr { grid-area: pr; } .ln .rm { grid-area: rm; justify-self: end; }
  .tot { flex-direction: column; align-items: stretch; } .co { width: 100%; }
}
.empty { margin: 0; font: 400 16px/1.5 var(--font-body); color: #000; }
.empty a { color: inherit; text-underline-offset: 3px; }
.lbl { margin: clamp(28px, 3cqi, 40px) 0 12px; font: 600 11px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); }
.sstamps { max-width: 660px; }
.sec { padding: clamp(24px, 3cqi, 40px) 0 0; }

/* The bag panel (founder, round 1): the menu's motion (shell.css .panel), its own content. */
.bp-scrim { position: absolute; inset: 0; z-index: 50; background: rgb(20 17 15 / .4); opacity: 0; pointer-events: none; transition: opacity 420ms cubic-bezier(.65, 0, .35, 1); }
.bpan { position: absolute; top: 0; right: 0; bottom: 0; z-index: 51; width: min(92%, 440px); display: flex; flex-direction: column; background: var(--canvas); border-left: 1px solid var(--line); transform: translateX(105%); transition: transform 420ms cubic-bezier(.65, 0, .35, 1); }
.vp.bopen .bpan { transform: none; } .vp.bopen .bp-scrim { opacity: 1; pointer-events: auto; }
.bpan header { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 20px; border-bottom: 1px solid var(--line); }
.bpan header h2 { margin: 0; font: 500 22px/1 var(--font-heading); color: #1D1A17; }
.bpan .x { all: unset; cursor: pointer; width: 44px; height: 44px; display: grid; place-items: center; }
.bpan .x svg { width: 22px; height: 22px; }
.bpan .body { flex: 1; overflow-y: auto; padding: 0 20px; }
.bpan .lines { border-top: 0; }
.bpan .ln { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: 'pic nm pr' 'pic step rm'; }
.bpan .ln .pic { grid-area: pic; width: 64px; } .bpan .ln .info { grid-area: nm; } .bpan .ln .step { grid-area: step; justify-self: start; } .bpan .ln .pr { grid-area: pr; } .bpan .ln .rm { grid-area: rm; justify-self: end; }
.bpan footer { padding: 16px 20px 20px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.bpan footer .co { width: 100%; padding: 0; }
.bpan footer .view { justify-self: center; font: 500 14px/1 var(--font-ui); color: #000; text-underline-offset: 3px; }
.bpan .tot { padding: 0; } .bpan .empty { padding: 24px 0; }
.pscroll { height: 100%; overflow-y: auto; overscroll-behavior: contain; }
.pscroll .top { position: sticky; top: 0; }
</style>
</head>
<body data-demo="on" data-bag="full">
<div class="mk-bar">
  <strong>IWC design pass · 9 bag · round 1</strong>
  <span>Kasavu saree + Set-mundu, as added on production</span>
  <span class="sep"></span>
  <span>Banner</span>
  <button type="button" data-set="demo" data-val="on" aria-pressed="true">On</button>
  <button type="button" data-set="demo" data-val="off" aria-pressed="false">Off</button>
</div>

<main class="mk-wrap">
  <h2 class="mk-h">The bag page (/cart)</h2>
  <p class="mk-p">A photo on each line, − 1 + for the quantity (try it: the subtotal follows), the rest as today.</p>
  <div data-bag-page="full" data-w="1440"></div>
  <div class="mk-row"><div data-bag-page="full" data-w="768"></div><div data-bag-page="full" data-w="390"></div></div>
  <h2 class="mk-h">The bag panel: <b>click the bag icon</b> in any frame's header</h2>
  <div class="mk-row"><div data-bag-panel="full" data-w="1440"></div></div>
  <div class="mk-row"><div data-bag-panel="full" data-w="390"></div><div data-bag-panel="empty" data-w="390"></div></div>
  <h2 class="mk-h">An empty bag page</h2>
  <div data-bag-page="empty" data-w="1440"></div>
  <div class="mk-row"><div data-bag-page="empty" data-w="390"></div></div>
</main>

<script src="../_shared/brand.js"></script>
<script src="../../mockups/shared/data.js"></script>
<script src="../_shared/shell.js"></script>
<script src="../_shared/cards.js"></script>
<script>
const KASAVU = '../../mockups/assets/Kasavu_main.jpg';
const LINES = [['Kasavu saree', 'Off-white with gold · Kerala', 11499, KASAVU], ['Set-mundu', 'Off-white with gold · Kerala', 13999, null]];
const usd = (c) => `$${(c / 100).toFixed(2)}`;
const OPEN = ['assam', 'delhi', 'kerala', 'maharashtra', 'punjab'];
const JUST = 'Cotton mekhela chador|$115.99|Assam;Japan-fit baggy jeans|$80.99|Delhi;Kasavu saree|$114.99|Kerala;Paithani saree|$575.99|Maharashtra;Phulkari dupatta|$33.99|Punjab;Bootcut jeans|$57.99|Delhi'
  .split(';').map((r) => { const [n, p, s] = r.split('|'); return [n, p, s, n === 'Kasavu saree' ? KASAVU : null, true]; });

const line = ([n, op, cents, img]) => `<li class="ln" data-cents="${cents}">
  <a class="pic${img ? '' : ' ph'}" href="#" aria-label="${n}"${img ? ` style="background-image:url(${img})"` : ''}></a>
  <span class="info"><a class="nm" href="#">${n}</a><span class="op">${op}</span></span>
  <span class="step"><button type="button" aria-label="One less" disabled>−</button><output>1</output><button type="button" aria-label="One more">+</button></span>
  <span class="pr">${usd(cents)}</span><a class="rm" href="#">Remove</a></li>`;
const total = () => LINES.reduce((a, l) => a + l[2], 0);
const totals = () => `<div class="tot"><p>Subtotal <b class="sub">${usd(total())}</b><small>Shipping, tax and delivery dates are shown at checkout.</small></p><a class="co" href="#">Checkout</a></div>`;
const emptyLine = '<p class="empty">Your bag is empty. <a href="#">Find something from home</a>.</p>';
const rowHtml = (label, cards) => `<div class="rowwrap"><ul class="row" aria-label="${label}">${cards.map(card).join('')}</ul><button class="rarr l" type="button" aria-label="Scroll ${label} back" disabled>←</button><button class="rarr r" type="button" aria-label="Scroll ${label} on">→</button></div>`;

const bagPage = (state) => `<div class="bg"><h1>Your bag</h1>${state === 'full'
  ? `<ul class="lines">${LINES.map(line).join('')}</ul>${totals()}`
  : `${emptyLine}<p class="lbl">Open now</p><div class="sstamps">${stampsBlock(IWC.regions.filter((r) => OPEN.includes(r.slug)))}</div>
     <section class="sec"><div class="sec-h"><h2>Just listed</h2><a class="pill" href="#">See all</a></div>${rowHtml('Just listed', JUST)}</section>`}</div>`;
const bagPanel = (state) => `<div class="bp-scrim"></div><aside class="bpan" aria-label="Your bag">
  <header><h2>Your bag${state === 'full' ? ' (2)' : ''}</h2><button class="x" type="button" aria-label="Close">${svg('close')}</button></header>
  <div class="body">${state === 'full' ? `<ul class="lines">${LINES.map(line).join('')}</ul>` : emptyLine}</div>
  ${state === 'full' ? `<footer>${totals().replace('<a class="co" href="#">Checkout</a>', '')}<a class="co" href="#">Checkout</a><a class="view" href="#">View bag</a></footer>` : ''}</aside>`;

document.querySelectorAll('[data-bag-page]').forEach((el) => {
  const w = +el.dataset.w, st = el.dataset.bagPage;
  el.innerHTML = dev(w, null, `${header()}${bagPage(st)}${footer()}${bagPanel('full')}`, `${w} · ${st === 'full' ? 'two pieces' : 'empty'}`);
});
document.querySelectorAll('[data-bag-panel]').forEach((el) => {
  const w = +el.dataset.w, st = el.dataset.bagPanel;
  el.innerHTML = dev(w, w < 500 ? 844 : 900, `<div class="pscroll">${header()}${sample()}${footer()}</div>${bagPanel(st)}`, `${w} · bag panel${st === 'empty' ? ', empty' : ''}`);
  if (st === 'empty') el.querySelectorAll('.hdr .count').forEach((c) => c.remove());
});
document.querySelectorAll('.hdr .count').forEach((c) => { c.textContent = '2'; });
shellInit(); initRows(); initStampPagers();

// Quantity: − / + within 1 – 10 (today's limit); the line price and the subtotal follow.
document.querySelectorAll('.ln').forEach((ln) => {
  const [minus, plus] = ln.querySelectorAll('.step button'), out = ln.querySelector('output'), cents = +ln.dataset.cents;
  const scope = ln.closest('.bpan, .bg');
  const set = (q) => {
    out.textContent = q; minus.disabled = q <= 1; plus.disabled = q >= 10; ln.querySelector('.pr').textContent = usd(cents * q);
    const sum = [...scope.querySelectorAll('.ln')].reduce((a, l) => a + +l.dataset.cents * +l.querySelector('output').textContent, 0);
    scope.querySelector('.sub').textContent = usd(sum);
  };
  minus.addEventListener('click', () => set(+out.textContent - 1)); plus.addEventListener('click', () => set(+out.textContent + 1));
});
// Bag panel: the header's bag icon opens it; × or the dimmed page closes it.
document.querySelectorAll('.vp').forEach((vp) => {
  const bag = vp.querySelector('.hdr a[aria-label^="Bag"]'); if (!bag) return;
  bag.addEventListener('click', (e) => { e.preventDefault(); vp.classList.add('bopen'); });
  vp.querySelector('.bpan .x').addEventListener('click', () => vp.classList.remove('bopen'));
  vp.querySelector('.bp-scrim').addEventListener('click', () => vp.classList.remove('bopen'));
  if (vp.closest('[data-bag-panel]')) requestAnimationFrame(() => vp.classList.add('bopen'));
});
</script>
</body>
</html>
