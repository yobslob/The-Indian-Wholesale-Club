<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IWC design pass: 16 errors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Karla:wght@400;500;600;700&family=Syne:wght@400;500;600&family=Gelasio&display=swap">
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/page.css">
<link rel="stylesheet" href="../_shared/shell.css">
<style>
/* ---------- Not found / error (round 2): header and footer, a line in our voice, proper buttons; nothing else. ---------- */
.er { --g: clamp(16px, 2.2cqi, 32px); padding: clamp(48px, 8cqi, 120px) var(--g) clamp(64px, 10cqi, 160px); }
.msg { max-width: 620px; }
.msg h1 { margin: 0 0 10px; font: 500 clamp(34px, 3.6cqi, 56px)/1.05 var(--font-heading); letter-spacing: -.02em; color: #1D1A17; }
.msg p { margin: 0 0 22px; font: 400 18px/1.5 var(--font-body); color: #000; }
.draft { display: inline-block; margin-left: 6px; padding: 1px 5px; border: 1px dashed var(--caution); border-radius: 4px; font: 700 9px/1.4 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--caution); vertical-align: middle; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.b1, .b2 { display: inline-grid; place-items: center; min-height: 52px; padding: 0 28px; border-radius: var(--radius-pill); font: 600 16px/1 var(--font-ui); text-decoration: none; }
.b1 { background: var(--brand); color: var(--on-brand); } .b2 { border: 1px solid var(--line); background: var(--paper); color: #000; }
</style>
</head>
<body data-demo="on" data-bag="empty">
<div class="mk-bar">
  <strong>IWC design pass · 16 errors · round 2</strong>
  <span>The two lines are drafts</span>
  <span class="sep"></span>
  <span>Banner</span>
  <button type="button" data-set="demo" data-val="on" aria-pressed="true">On</button>
  <button type="button" data-set="demo" data-val="off" aria-pressed="false">Off</button>
</div>
<main class="mk-wrap">
  <h2 class="mk-h">Page not found</h2>
  <div class="mk-row"><div data-er="404" data-w="1440"></div></div>
  <div class="mk-row"><div data-er="404" data-w="390"></div><div data-er="500" data-w="390"></div></div>
  <h2 class="mk-h">Something went wrong</h2>
  <div class="mk-row"><div data-er="500" data-w="1440"></div></div>
</main>
<script src="../_shared/brand.js"></script>
<script src="../_shared/shell.js"></script>
<script>
const MSG = {
  404: `<h1>Page not found</h1><p>We looked everywhere, even under the bed. This page isn't here. <span class="draft">draft</span></p><div class="btns"><a class="b1" href="#">Back to Home</a></div>`,
  500: `<h1>Something went wrong</h1><p>That's on us, not you. Try again, and if it keeps happening, give it a few minutes. <span class="draft">draft</span></p><div class="btns"><a class="b1" href="#">Try again</a><a class="b2" href="#">Back to Home</a></div>`,
};
const page = (k) => `<div class="er"><div class="msg">${MSG[k]}</div></div>`; // nothing under the message (founder, errors round 2)
document.querySelectorAll('[data-er]').forEach((el) => { const w = +el.dataset.w, k = el.dataset.er; el.innerHTML = dev(w, null, `${header()}${page(k)}${footer()}`, `${w} · ${k === '404' ? 'page not found' : 'something went wrong'}`); });
shellInit();
</script>
</body>
</html>
