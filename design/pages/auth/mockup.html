<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IWC design pass: 14 auth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Karla:wght@400;500;600;700&family=Syne:wght@400;500;600&family=Gelasio&display=swap">
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/page.css">
<link rel="stylesheet" href="../_shared/shell.css">
<style>
/* ---------- Auth (round 1): the profile's sign-in card (D-089) with show password, forgot password and an email code. ---------- */
.si { --g: clamp(16px, 2.2cqi, 32px); padding: clamp(32px, 5cqi, 80px) var(--g); display: grid; place-items: center; }
.sic { width: min(100%, 440px); padding: clamp(24px, 3cqi, 36px); border-radius: var(--radius-lg); background: var(--surface); box-sizing: border-box; }
.sic h1 { margin: 0 0 6px; font: 500 clamp(28px, 2.6cqi, 40px)/1.1 var(--font-heading); letter-spacing: -.02em; color: #1D1A17; }
.sic .lead { margin: 0 0 20px; font: 400 15px/1.5 var(--font-body); color: var(--ink-muted); }
.sic .lead b { color: #000; font-weight: 600; }
.fld { display: block; margin: 0 0 14px; font: 500 13px/1.3 var(--font-ui); color: #000; }
.fld .in { position: relative; margin-top: 6px; }
.fld input { all: unset; box-sizing: border-box; display: block; width: 100%; min-height: 48px; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--paper); font: 400 15px/48px var(--font-ui); color: #000; }
.fld input:focus { border-color: var(--ink); }
.pw input { padding-right: 52px; }
.eye { all: unset; cursor: pointer; position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-muted); }
.eye svg { width: 20px; height: 20px; }
.eye .shut { display: none; } .eye[aria-pressed="true"] .open { display: none; } .eye[aria-pressed="true"] .shut { display: block; }
.forgot { all: unset; cursor: pointer; display: block; margin: -6px 0 16px auto; font: 500 13px/1 var(--font-ui); color: #000; text-decoration: underline; text-underline-offset: 3px; min-height: 28px; }
.primary { all: unset; cursor: pointer; display: grid; place-items: center; box-sizing: border-box; width: 100%; height: 52px; border-radius: var(--radius-pill); background: var(--brand); color: var(--on-brand); font: 600 16px/1 var(--font-ui); }
.secondary { all: unset; cursor: pointer; display: grid; place-items: center; box-sizing: border-box; width: 100%; height: 48px; margin-top: 10px; border-radius: var(--radius-pill); border: 1px solid var(--line); background: var(--paper); font: 600 15px/1 var(--font-ui); color: #000; }
.or { display: flex; align-items: center; gap: 12px; margin: 16px 0 6px; font: 500 12px/1 var(--font-ui); color: var(--ink-muted); }
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.alt { margin: 16px 0 0; text-align: center; font: 400 14px/1.5 var(--font-body); color: var(--ink-muted); }
.alt button { all: unset; cursor: pointer; color: #000; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.code { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin: 0 0 16px; }
.code input { all: unset; box-sizing: border-box; width: 100%; height: 56px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--paper); text-align: center; font: 600 22px/56px var(--font-ui); color: #000; }
.code input:focus { border-color: var(--ink); }
.st { display: none; } .st.on { display: block; }
.ok { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: rgb(22 101 52 / .12); color: var(--positive); margin-bottom: 14px; }
.ok svg { width: 24px; height: 24px; }
.draft { display: inline-block; margin-left: 6px; padding: 1px 5px; border: 1px dashed currentColor; border-radius: 4px; font: 700 9px/1.4 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--caution); vertical-align: middle; }
</style>
</head>
<body data-demo="on" data-bag="empty">
<div class="mk-bar">
  <strong>IWC design pass · 14 auth · round 1</strong>
  <span>New wording is draft</span>
  <span class="sep"></span>
  <span>Banner</span>
  <button type="button" data-set="demo" data-val="on" aria-pressed="true">On</button>
  <button type="button" data-set="demo" data-val="off" aria-pressed="false">Off</button>
</div>

<main class="mk-wrap">
  <h2 class="mk-h">One card, every way in (walk through it in the first frame)</h2>
  <p class="mk-p">Try the eye, "Forgot password?", "Email me a sign-in code" and "Create an account". The other frames show each state.</p>
  <div class="mk-row"><div data-au="signin" data-w="1440"></div></div>
  <div class="mk-row"><div data-au="signin" data-w="390"></div><div data-au="forgot" data-w="390"></div><div data-au="forgot-sent" data-w="390"></div></div>
  <div class="mk-row"><div data-au="code" data-w="390"></div><div data-au="code-enter" data-w="390"></div><div data-au="new-password" data-w="390"></div></div>
  <div class="mk-row"><div data-au="create" data-w="390"></div><div data-au="created" data-w="390"></div></div>
</main>

<script src="../_shared/brand.js"></script>
<script src="../_shared/shell.js"></script>
<script>
const eyeBtn = '<button class="eye" type="button" aria-label="Show password" aria-pressed="false"><svg class="icon open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="icon shut" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.5 10.5 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.5 4.5-1.2M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>';
const check = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const pw = (label, ac) => `<label class="fld pw">${label}<span class="in"><input type="password" autocomplete="${ac}" value="kasavu-onam">${eyeBtn}</span></label>`;
const email = (v = '') => `<label class="fld">Email<span class="in"><input type="email" autocomplete="email" value="${v}"></span></label>`;
const D = '<span class="draft">draft</span>';
const STATES = {
  signin: `<h1>Sign in</h1><p class="lead">To see your orders, saved pieces and addresses.</p>${email('meera@example.com')}${pw('Password', 'current-password')}
    <button class="forgot" type="button" data-go="forgot">Forgot password?</button><button class="primary" type="button">Sign in</button>
    <p class="or">or</p><button class="secondary" type="button" data-go="code">Email me a sign-in code</button>
    <p class="alt">New here? <button type="button" data-go="create">Create an account</button></p>`,
  forgot: `<h1>Forgot password</h1><p class="lead">We'll email you a link to set a new one. ${D}</p>${email('meera@example.com')}
    <button class="primary" type="button" data-go="forgot-sent">Send reset link</button><p class="alt"><button type="button" data-go="signin">Back to sign in</button></p>`,
  'forgot-sent': `<span class="ok">${check}</span><h1>Check your email</h1><p class="lead">We sent a reset link to <b>meera@example.com</b>. ${D}</p>
    <button class="secondary" type="button">Send it again</button><p class="alt"><button type="button" data-go="signin">Back to sign in</button></p>`,
  'new-password': `<h1>Set a new password</h1><p class="lead">At least 8 characters.</p>${pw('New password', 'new-password')}${pw('Type it again', 'new-password')}
    <button class="primary" type="button" data-go="signin">Save and sign in</button>`,
  code: `<h1>Sign in with a code</h1><p class="lead">We'll email you a 6-digit code. No password needed. ${D}</p>${email('meera@example.com')}
    <button class="primary" type="button" data-go="code-enter">Send code</button><p class="alt"><button type="button" data-go="signin">Use a password instead</button></p>`,
  'code-enter': `<h1>Enter the code</h1><p class="lead">Sent to <b>meera@example.com</b>. ${D}</p>
    <div class="code" role="group" aria-label="6-digit code">${[0, 1, 2, 3, 4, 5].map((i) => `<input inputmode="numeric" maxlength="1" aria-label="Digit ${i + 1}" autocomplete="${i ? 'off' : 'one-time-code'}">`).join('')}</div>
    <button class="primary" type="button">Sign in</button><p class="alt"><button type="button">Resend code</button> · <button type="button" data-go="signin">Use a password instead</button></p>`,
  create: `<h1>Create an account</h1><p class="lead">Save pieces and see every order in one place.</p>
    <label class="fld">Full name<span class="in"><input autocomplete="name"></span></label>${email()}${pw('Password (8 or more characters)', 'new-password')}
    <button class="primary" type="button" data-go="created">Create account</button><p class="alt">Already have an account? <button type="button" data-go="signin">Sign in</button></p>`,
  created: `<span class="ok">${check}</span><h1>Almost there</h1><p class="lead">Check your inbox to confirm your email, then sign in.</p><p class="alt"><button type="button" data-go="signin">Back to sign in</button></p>`,
};
const card = (on) => `<div class="si"><form class="sic" onsubmit="return false">${Object.entries(STATES).map(([k, h]) => `<div class="st${k === on ? ' on' : ''}" data-st="${k}">${h}</div>`).join('')}</form></div>`;
const LABEL = { signin: 'sign in', forgot: 'forgot password', 'forgot-sent': 'reset link sent', 'new-password': 'from the reset link', code: 'email code', 'code-enter': 'enter the code', create: 'create an account', created: 'account created' };
document.querySelectorAll('[data-au]').forEach((el) => { const w = +el.dataset.w, k = el.dataset.au; el.innerHTML = dev(w, null, `${header()}${card(k)}${footer()}`, `${w} · ${LABEL[k]}`); });
shellInit();

document.querySelectorAll('.sic').forEach((f) => {
  f.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]'); if (go) { f.querySelectorAll('.st').forEach((s) => s.classList.toggle('on', s.dataset.st === go.dataset.go)); f.querySelector('.st.on input')?.focus({ preventScroll: true }); }
    const eye = e.target.closest('.eye'); if (eye) { const i = eye.parentElement.querySelector('input'), on = eye.getAttribute('aria-pressed') !== 'true'; eye.setAttribute('aria-pressed', on); eye.setAttribute('aria-label', on ? 'Hide password' : 'Show password'); i.type = on ? 'text' : 'password'; }
  });
  // Code boxes: typing moves on, Backspace moves back, pasting fills all six.
  const boxes = [...f.querySelectorAll('.code input')];
  boxes.forEach((b, i) => {
    b.addEventListener('input', () => { b.value = b.value.replace(/\D/g, '').slice(-1); if (b.value && boxes[i + 1]) boxes[i + 1].focus(); });
    b.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !b.value && boxes[i - 1]) boxes[i - 1].focus(); });
    b.addEventListener('paste', (e) => { const d = (e.clipboardData.getData('text').match(/\d/g) || []).slice(0, 6); if (!d.length) return; e.preventDefault(); d.forEach((x, j) => { if (boxes[j]) boxes[j].value = x; }); boxes[Math.min(d.length, 5)].focus(); });
  });
});
</script>
</body>
</html>
