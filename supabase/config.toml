# A string used to distinguish different Supabase projects on the same host.
project_id = "root-ecommerce"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
# Applied by `supabase db reset` (local only). demo.sql and catalogue.sql are DEV-ONLY placeholder
# data (is_placeholder = true); never apply it to production (INV-8). estimates.sql: labelled pricing estimates (D-047).
enabled = true
sql_paths = ["./seed/regions.sql", "./seed/categories.sql", "./seed/demo.sql", "./seed/catalogue.sql", "./seed/estimates.sql"]

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# The reset link comes back to /auth/callback (D-091): the dev server and the e2e server (port 3101).
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**", "http://localhost:3101/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# "Email me a sign-in code" (D-091): six digits, valid for an hour.
otp_length = 6
otp_expiry = 3600

# D-091: Supabase Auth sends these two emails. Draft wording in the IWC voice; the same text goes into the hosted
# project's Auth email templates before launch (docs/ops.md).
[auth.email.template.magic_link]
subject = "Your sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

[auth.email.template.recovery]
subject = "Set a new password"
content_path = "./supabase/templates/reset-password.html"

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""
url = ""

[auth.external.apple]
enabled = false
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_CLIENT_SECRET)"
redirect_uri = ""
url = ""

[analytics]
enabled = false
port = 54327
backend = "postgres"
